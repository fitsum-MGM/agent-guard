<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Agent Guard Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 780px; margin: 40px auto; padding: 0 16px; background: #0b0f14; color: #e6edf3; }
  h1 { font-size: 22px; }
  .card { background: #131a22; border: 1px solid #263140; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1c2530; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .bar-bg { background: #1c2530; border-radius: 6px; height: 10px; overflow: hidden; margin-top: 8px; }
  .bar-fill { background: #3fb950; height: 100%; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.allowed { background: #123821; color: #3fb950; }
  .badge.blocked { background: #3a1a1a; color: #f85149; }
  .revoked { color: #f85149; font-weight: 600; }
  .active { color: #3fb950; font-weight: 600; }
  #revokeBtn { background: #f85149; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  .event { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1c2530; font-size: 13px; }
  a { color: #58a6ff; }
  input { background: #0b0f14; color: #e6edf3; border: 1px solid #263140; border-radius: 6px; padding: 6px 8px; width: 100%; margin-bottom: 8px; box-sizing: border-box; }
  #requestCard { border-color: #d29922; }
  #requestCard button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; margin-right: 8px; }
  #approveBtn { background: #3fb950; color: #0b0f14; }
  #denyBtn { background: #f85149; color: white; }
</style>
</head>
<body>
  <h1>🛡️ Agent Guard</h1>

  <div class="card">
    <input id="owner" placeholder="Owner public key" />
    <input id="agent" placeholder="Agent public key" />
  </div>

  <div class="card" id="policyCard">Loading policy...</div>
  <div class="card" id="requestCard" style="display:none"></div>
  <div class="card">
    <h3 style="margin-top:0">Activity</h3>
    <div id="activity">Loading activity...</div>
  </div>

  <script>
    const API = "http://localhost:5050";
    const $ = (id) => document.getElementById(id);

    const params = new URLSearchParams(location.search);
    $("owner").value = params.get("owner") || localStorage.getItem("owner") || "";
    $("agent").value = params.get("agent") || localStorage.getItem("agent") || "";

    function fmt(amountStr) { return (Number(amountStr) / 1e6).toFixed(2); }
    function timeAgo(unix) {
      if (!unix) return "";
      const s = Math.floor(Date.now() / 1000) - unix;
      if (s < 0) return `in ${Math.floor(-s / 60)}m`;
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      return `${Math.floor(s / 3600)}h ago`;
    }

    async function refresh() {
      const owner = $("owner").value.trim();
      const agent = $("agent").value.trim();
      if (!owner || !agent) return;
      localStorage.setItem("owner", owner);
      localStorage.setItem("agent", agent);

      try {
        const p = await fetch(`${API}/api/policy?owner=${owner}&agent=${agent}`).then((r) => r.json());
        if (p.error) throw new Error(p.error);
        const pct = Math.min(100, (Number(p.spentToday) / Number(p.dailyCap)) * 100);
        $("policyCard").innerHTML = `
          <div class="row"><span>Status</span><span class="${p.revoked ? "revoked" : "active"}">${p.revoked ? "REVOKED" : "ACTIVE"}</span></div>
          <div class="row"><span>Daily spend</span><span>${fmt(p.spentToday)} / ${fmt(p.dailyCap)} USDC</span></div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="row"><span>Per-transaction cap</span><span>${fmt(p.perTxCap)} USDC</span></div>
          <div class="row"><span>Allowlisted recipients</span><span>${p.allowlist.length}</span></div>
          <div class="row"><span>Expires</span><span>${new Date(p.expiresAt * 1000).toLocaleString()}</span></div>
          <div style="margin-top:12px"><button id="revokeBtn">${p.revoked ? "Already revoked" : "🛑 Revoke agent"}</button></div>
        `;
        $("revokeBtn").disabled = p.revoked;
        $("revokeBtn").onclick = () =>
          alert("Revoking from the dashboard requires the owner's wallet to sign — call ownerGuard.setRevoked(...) from the SDK or CLI for the live demo.");
      } catch (e) {
        $("policyCard").textContent = "No policy found for that owner/agent pair yet.";
      }

      try {
        const events = await fetch(`${API}/api/activity?owner=${owner}&agent=${agent}`).then((r) => r.json());
        if (!Array.isArray(events) || events.length === 0) {
          $("activity").textContent = "No activity yet.";
          return;
        }
        $("activity").innerHTML = events
          .map((e) => {
            if (e.status === "allowed") {
              return `<div class="event">
                <span><span class="badge allowed">ALLOWED</span> paid ${fmt(e.amount)} USDC to ${e.recipient.slice(0, 6)}...</span>
                <span>${timeAgo(e.time)}</span>
              </div>`;
            }
            return `<div class="event">
              <span><span class="badge blocked">BLOCKED</span> ${e.reason}</span>
              <span>${timeAgo(e.time)}</span>
            </div>`;
          })
          .join("");
      } catch (e) {
        $("activity").textContent = "Could not load activity.";
      }
    }

    async function refreshRequest() {
      const owner = $("owner").value.trim();
      const agent = $("agent").value.trim();
      if (!owner || !agent) return;
      const r = await fetch(`${API}/api/request?owner=${owner}&agent=${agent}`).then((x) => x.json());
      const card = $("requestCard");
      const now = Math.floor(Date.now() / 1000);

      if (!r || r.resolved || r.expiresAt < now) {
        card.style.display = "none";
        return;
      }
      card.style.display = "block";
      card.innerHTML = `
        <div style="font-weight:600; color:#d29922; margin-bottom:6px">⏳ Agent is requesting more budget</div>
        <div class="row"><span>Amount</span><span>+${fmt(r.extraAmount)} USDC</span></div>
        <div class="row"><span>Reason</span><span>${r.reason}</span></div>
        <div class="row"><span>Expires</span><span>${timeAgo(r.expiresAt)}</span></div>
        <div style="margin-top:10px">
          <button id="approveBtn">✅ Approve</button>
          <button id="denyBtn">❌ Deny</button>
        </div>
      `;
      $("approveBtn").onclick = () =>
        alert("Approving from the dashboard requires the owner's wallet to sign — run ownerGuard.respondToRequest(agent, true) from the SDK for the live demo.");
      $("denyBtn").onclick = () =>
        alert("Denying from the dashboard requires the owner's wallet to sign — run ownerGuard.respondToRequest(agent, false) from the SDK for the live demo.");
    }

    $("owner").addEventListener("change", refresh);
    $("agent").addEventListener("change", refresh);
    $("owner").addEventListener("change", refreshRequest);
    $("agent").addEventListener("change", refreshRequest);
    refresh();
    refreshRequest();
    setInterval(refresh, 8000);
    setInterval(refreshRequest, 8000);
  </script>
</body>
</html>
